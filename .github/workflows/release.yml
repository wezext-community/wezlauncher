name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Package
        id: pkg
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          $name = "wezlauncher-v$ver-x86_64-pc-windows-msvc"
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item "target/release/wezlauncher.exe" dist/
          Compress-Archive -Path "dist/wezlauncher.exe" -DestinationPath "dist/$name.zip" -Force
          $sha = (Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$sha" | Set-Content "dist/$name.zip.sha256"
          "ver=$ver" >> $env:GITHUB_OUTPUT
          "sha=$sha" >> $env:GITHUB_OUTPUT
          "file=dist/$name.zip" >> $env:GITHUB_OUTPUT

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.pkg.outputs.file }}
            ${{ steps.pkg.outputs.file }}.sha256
          generate_release_notes: true

      - name: Dispatch to wezext-index
        # 需要在仓库 secrets 里配置 WEZEXT_BOT_TOKEN（对 wezext-index 有写权限的 PAT）
        env:
          TOKEN: ${{ secrets.WEZEXT_BOT_TOKEN }}
        if: env.TOKEN != ''
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ env.TOKEN }}
          repository: wezext-community/wezext-index
          event-type: ext-release
          client-payload: |
            {
              "name": "wezlauncher",
              "version": "${{ steps.pkg.outputs.ver }}",
              "sha256": "${{ steps.pkg.outputs.sha }}"
            }
